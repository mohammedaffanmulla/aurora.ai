[project]
name = "aurora-backend"
version = "0.1.0"
description = "Aurora - AI Agent Platform Backend"
readme = "../README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16.0",
    "psycopg[binary]>=3.2.0",
    "redis>=6.2.0",
    "qdrant-client>=1.15.0",
    "httpx>=0.28.0",
    "google-genai>=1.30.0",
    "loguru>=0.7.3",
    "asyncpg>=0.31.0",
    "python-jose[cryptography]>=3.5.0",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "black>=25.0.0",
    "ruff>=0.12.0",
    "isort>=6.0.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.isort]
profile = "black"
